name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests (cross-browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate data, rules & changelog
        run: |
          python scripts/extract_tmc_data.py
          python scripts/gen_rules.py
          python scripts/gen_changelog.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build:ci

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-and-release:
    name: Build & Release
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Generate data, rules & changelog
        run: |
          python scripts/extract_tmc_data.py
          python scripts/gen_rules.py
          python scripts/gen_changelog.py

      - name: Fetch randomizer branches
        run: git -C SubModule/randomizer fetch origin master staging --depth=1

      - name: Install dependencies
        run: npm install

      - name: Build stable (master)
        run: npm run build

      - name: Generate version
        run: |
          echo "VERSION=$(date +'%d.%m.%Y-%H:%M:%S')" >> $GITHUB_ENV
          echo "TAG=$(date +'%d.%m.%Y-%H.%M.%S')" >> $GITHUB_ENV

      - name: Create zip
        run: |
          cd dist
          zip -r ../tmcr-tracker-${{ env.TAG }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.VERSION }}
          files: tmcr-tracker-${{ env.TAG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone site-repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --branch officiel --single-branch \
            https://x-access-token:${GH_PAT}@github.com/deoxis9001/MinishCap_Site.git site-repo
          git -C site-repo config user.email "github-actions[bot]@users.noreply.github.com"
          git -C site-repo config user.name "github-actions[bot]"

      - name: Deploy stable → tmcr-tracker
        run: |
          rm -rf site-repo/tmcr-tracker
          mkdir -p site-repo/tmcr-tracker
          cp -r dist/. site-repo/tmcr-tracker/

      - name: Build beta (staging)
        run: npm run build-dev

      - name: Deploy beta → tmcr-tracker-beta
        run: |
          rm -rf site-repo/tmcr-tracker-beta
          mkdir -p site-repo/tmcr-tracker-beta
          cp -r dist/. site-repo/tmcr-tracker-beta/

      - name: Push to MinishCap_Site
        run: |
          cd site-repo
          git add tmcr-tracker/ tmcr-tracker-beta/
          git diff --staged --quiet && echo "Nothing to deploy" || \
            (git commit -m "deploy: tmcr-tracker ${{ env.VERSION }}" && git push origin officiel)
